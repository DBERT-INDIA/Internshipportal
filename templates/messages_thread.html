<!doctype html>
<html lang="en">
<head>
{% set page_title_full %}{{ label }} · Messages · DBERT{% endset %}
{% include "_head.html" %}
<meta name="robots" content="noindex, nofollow">
</head>
<body class="pg-messages-thread has-sidebar">
{% set active_page = 'messages' %}
{% include '_intern_sidebar.html' %}

  <div class="wrap">
    <div class="top">
      <a href="/messages"><i class="fas fa-arrow-left"></i></a>
      <h1><i class="fas fa-comments"></i> {{ label }}</h1>
    </div>
    <div class="stream" id="stream">
      {% for m in messages %}
      <div class="bubble {{ 'mine' if m.sender_type == actor.sender_type else 'theirs' }}" data-id="{{ m.id }}">
        {{ m.body }}<span class="meta">{{ (m.created_at or '')[5:16] }}</span>
      </div>
      {% else %}
      <div class="empty" id="emptyState">Say hello 👋</div>
      {% endfor %}
    </div>
    <form class="composer" data-act-submit="sendMsg" data-arg-submit='["$event"]' data-ret-submit>
      <input id="body" autocomplete="off" placeholder="Type a message…" maxlength="4000"/>
      <button type="submit">Send</button>
    </form>
  </div>
  <script nonce="{{ csp_nonce() }}">
    var convId = {{ conv_id }};
    var mySender = {{ actor.sender_type|tojson }};
    var lastId = (function(){
      var b = document.querySelectorAll('#stream .bubble');
      return b.length ? parseInt(b[b.length-1].dataset.id) : 0;
    })();
    var stream = document.getElementById('stream');
    function scroll(){ stream.scrollTop = stream.scrollHeight; }
    function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function addBubble(m){
      var es = document.getElementById('emptyState'); if(es) es.remove();
      var el = document.createElement('div');
      el.className = 'bubble ' + (m.sender_type === mySender ? 'mine' : 'theirs');
      el.dataset.id = m.id;
      el.innerHTML = esc(m.body) + '<span class="meta">' + esc((m.created_at||'').slice(5,16)) + '</span>';
      stream.appendChild(el); lastId = Math.max(lastId, m.id); scroll();
    }
    async function sendMsg(e){
      e.preventDefault();
      var input = document.getElementById('body');
      var body = input.value.trim(); if(!body) return false;
      input.value = '';
      try{
        var r = await fetch('/messages/'+convId+'/send', {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({body: body})});
        var d = await r.json();
        if(d.status === 'success'){ addBubble(d.message_obj); }
        else { alert(d.message || 'Could not send.'); input.value = body; }
      }catch(err){ alert('Network error.'); input.value = body; }
      return false;
    }
    async function poll(){
      try{
        var r = await fetch('/messages/'+convId+'/poll?after='+lastId);
        var d = await r.json();
        if(d.status === 'success'){ d.messages.forEach(addBubble); }
      }catch(e){}
    }
    scroll();
    setInterval(poll, 10000);  // ~10s polling (text-only v1)
  </script>
</body>
</html>
